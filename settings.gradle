pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "HabitPets"

// Host assembles features; core modules contain shared contracts and infrastructure.
include ':app'
include ':core:model', ':core:data', ':core:common', ':core:ai'
include ':feature:planning', ':feature:chat', ':feature:pet', ':feature:shop', ':feature:interaction'
